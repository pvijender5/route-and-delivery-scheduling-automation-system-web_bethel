<!-- Notes Modal -->
<div class="modal fade" id="notesviewModal" tabindex="-1" role="dialog" aria-labelledby="notesviewModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="notesviewModalLabel">Notes</h5>
                <button type="button" class="btn-close py-0" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true"></span>
                </button>
            </div>
            <div class="modal-body">
                <div id="notesContent"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary close" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
